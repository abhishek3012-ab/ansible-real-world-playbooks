
---
- name: Apply Linux server security hardening
  hosts: all
  become: true
  gather_facts: true

  vars:
    security_user: deployuser
    security_ssh_port: 22
    security_ssh_public_key: ""

  pre_tasks:
    - name: Validate security configuration
      ansible.builtin.assert:
        that:
          - security_ssh_public_key | length > 0
          - security_ssh_port | int >= 1
          - security_ssh_port | int <= 65535
        fail_msg: >-
          Provide a valid SSH public key and SSH port before
          applying security configurations.

  tasks:
    - name: Update Ubuntu package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Upgrade installed packages
      ansible.builtin.apt:
        upgrade: safe

    - name: Install security packages
      ansible.builtin.apt:
        name:
          - ufw
          - openssh-server
        state: present

    - name: Create dedicated deployment user
      ansible.builtin.user:
        name: "{{ security_user }}"
        shell: /bin/bash
        create_home: true
        groups: sudo
        append: true
        state: present

    - name: Create SSH directory
      ansible.builtin.file:
        path: "/home/{{ security_user }}/.ssh"
        state: directory
        owner: "{{ security_user }}"
        group: "{{ security_user }}"
        mode: '0700'

    - name: Configure SSH public key authentication
      ansible.builtin.authorized_key:
        user: "{{ security_user }}"
        key: "{{ security_ssh_public_key }}"
        state: present

    - name: Configure SSH root login protection
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^\s*#?\s*PermitRootLogin\s+'
        line: 'PermitRootLogin no'
        insertbefore: BOF
        validate: '/usr/sbin/sshd -t -f %s'
        backup: true
      notify: Restart SSH

    - name: Ensure public key authentication is enabled
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^\s*#?\s*PubkeyAuthentication\s+'
        line: 'PubkeyAuthentication yes'
        insertbefore: BOF
        validate: '/usr/sbin/sshd -t -f %s'
        backup: true
      notify: Restart SSH

    - name: Allow SSH through UFW
      community.general.ufw:
        rule: allow
        port: "{{ security_ssh_port | string }}"
        proto: tcp

    - name: Allow HTTP traffic
      community.general.ufw:
        rule: allow
        port: '80'
        proto: tcp

    - name: Allow HTTPS traffic
      community.general.ufw:
        rule: allow
        port: '443'
        proto: tcp

    - name: Configure default incoming firewall policy
      community.general.ufw:
        direction: incoming
        policy: deny

    - name: Configure default outgoing firewall policy
      community.general.ufw:
        direction: outgoing
        policy: allow

    - name: Enable UFW firewall
      community.general.ufw:
        state: enabled

    - name: Verify SSH service status
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - ssh
      register: ssh_status
      changed_when: false

    - name: Verify firewall status
      ansible.builtin.command:
        argv:
          - ufw
          - status
      register: firewall_status
      changed_when: false

    - name: Display security configuration status
      ansible.builtin.debug:
        msg:
          - "SSH service: {{ ssh_status.stdout }}"
          - "Firewall status: {{ firewall_status.stdout }}"

  handlers:
    - name: Restart SSH
      ansible.builtin.service:
        name: ssh
        state: restarted
